<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理解スコア: __TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #d6d3d1; --panel: #ffffff; --dir: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --panel: #292524; --dir: #292524; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  header { padding: 16px 20px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .legend .bar { width: 160px; height: 10px; border-radius: 2px; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 8px 20px 20px; height: calc(100vh - 64px); min-height: 480px; }
  #map { position: relative; min-height: 0; }
  #map svg { display: block; width: 100%; height: 100%; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  ol { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; cursor: pointer; word-break: break-all; }
  li:hover { text-decoration: underline; }
  .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  #detail { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  #detail code { font-size: 11px; word-break: break-all; }
  #detail table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #detail td { padding: 2px 4px; border-bottom: 1px solid var(--line); }
  .tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .15); display: none; max-width: 360px; }
  .dir-label { font-size: 11px; fill: var(--muted); }
  .file-label { font-size: 11px; pointer-events: none; }
  rect.file { cursor: pointer; }
  /* SVG の fill 属性には CSS 変数が効かないブラウザがあるので、CSS で塗る */
  rect.dir { fill: var(--dir); }
  rect.file.selected { stroke: var(--fg); stroke-width: 2px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; height: auto; }
    #map { height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>理解スコア: <span id="repo"></span></h1>
  <span class="meta" id="meta"></span>
  <span class="legend">理解していない <span class="bar" id="legend-bar"></span> 理解している</span>
</header>
<main>
  <div id="map"></div>
  <aside>
    <h2>危険地帯の上位10件</h2>
    <ol id="danger"></ol>
    <div id="detail"><span class="meta">四角かリストをクリックすると、最後に理解してからの変更が出ます</span></div>
  </aside>
</main>
<div class="tip" id="tip"></div>
<script>
const report = /*__REPORT__*/ null;
// 赤〜青は、赤〜緑より色覚の違いに強い
const color = (score) => d3.interpolateRdYlBu(score);
const fmt = (n) => n.toFixed(2);
const day = (s) => (s ? s.slice(0, 10) : "-");
const originLabel = { autonomous: "自律", pair: "併走", human: "人間" };

document.getElementById("repo").textContent = report.repo;
document.getElementById("meta").textContent =
  `${report.files.length} ファイル ・ λ=${report.params.lambda} 併走倍率=${report.params.pairWeight} ・ ${new Date(report.generatedAt).toLocaleString()}`;
document.getElementById("legend-bar").style.background =
  `linear-gradient(to right, ${d3.range(0, 1.01, 0.1).map(color).join(",")})`;

// パスの一覧からディレクトリの木を作る
function buildTree(files) {
  const root = { name: report.repo, children: new Map() };
  for (const f of files) {
    const parts = f.path.split("/");
    let node = root;
    for (const part of parts.slice(0, -1)) {
      if (!node.children.has(part)) node.children.set(part, { name: part, children: new Map() });
      node = node.children.get(part);
    }
    node.children.set(parts.at(-1), { name: parts.at(-1), file: f });
  }
  const toArray = (n) => (n.children ? { ...n, children: [...n.children.values()].map(toArray) } : n);
  return toArray(root);
}

const root = d3.hierarchy(buildTree(report.files)).sum((d) => (d.file ? Math.max(1, d.file.size) : 0));
// ディレクトリのスコアは、中のファイルのスコアを行数で重み付けした平均
root.eachAfter((n) => {
  n.score = n.data.file ? n.data.file.score : d3.sum(n.children, (c) => c.score * c.value) / n.value;
});

const tip = document.getElementById("tip");
let selected = null;

function draw() {
  const el = document.getElementById("map");
  const { width, height } = el.getBoundingClientRect();
  // paddingOuter は上下左右をまとめて設定するので、ディレクトリ名の余白（paddingTop）はその後に設定する
  d3.treemap().size([width, height]).paddingOuter(2).paddingTop((d) => (d.depth === 0 ? 2 : 16)).paddingInner(2).round(true)(root);

  // 描き直すと四角が作り直され mouseleave が来ないので、ツールチップはここで隠す
  tip.style.display = "none";
  el.innerHTML = "";
  const svg = d3.select(el).append("svg").attr("viewBox", [0, 0, width, height]);
  const nodes = svg.selectAll("g").data(root.descendants()).join("g").attr("transform", (d) => `translate(${d.x0},${d.y0})`);

  nodes.filter((d) => d.children && d.depth > 0).call((g) => {
    g.append("rect").attr("class", "dir").attr("width", (d) => d.x1 - d.x0).attr("height", (d) => d.y1 - d.y0)
      .attr("stroke", (d) => color(d.score)).attr("stroke-width", 2).attr("rx", 3);
    g.append("text").attr("class", "dir-label").attr("x", 4).attr("y", 12)
      .text((d) => (d.x1 - d.x0 > 50 ? `${d.data.name}/ ${fmt(d.score)}` : ""));
  });

  const files = nodes.filter((d) => d.data.file);
  files.append("rect").attr("class", "file").attr("width", (d) => d.x1 - d.x0).attr("height", (d) => d.y1 - d.y0)
    .attr("fill", (d) => color(d.score)).attr("rx", 2)
    .classed("selected", (d) => d.data.file.path === selected)
    .on("mousemove", (event, d) => showTip(event, d.data.file))
    .on("mouseleave", () => (tip.style.display = "none"))
    .on("click", (_, d) => select(d.data.file.path));
  files.append("text").attr("class", "file-label").attr("x", 4).attr("y", 14)
    .attr("fill", (d) => (d3.hsl(color(d.score)).l > 0.6 ? "#1c1917" : "#fafaf9"))
    .text((d) => (d.x1 - d.x0 > 70 && d.y1 - d.y0 > 20 ? d.data.name : ""));
}

function showTip(event, f) {
  tip.innerHTML = `<b></b><br>score ${fmt(f.score)} ・ 危険度 ${fmt(f.danger)} ・ ${f.size} 行<br>最後の理解 ${day(f.lastUnderstoodDate)}`;
  tip.querySelector("b").textContent = f.path;
  tip.style.display = "block";
  tip.style.left = Math.min(event.clientX + 12, innerWidth - 370) + "px";
  tip.style.top = event.clientY + 12 + "px";
}

function select(path) {
  selected = path;
  const f = report.files.find((x) => x.path === path);
  const detail = document.getElementById("detail");
  detail.innerHTML = "";
  const h = document.createElement("h2");
  h.textContent = f.path;
  const summary = document.createElement("div");
  summary.className = "num";
  summary.textContent = `score ${fmt(f.score)} ・ 危険度 ${fmt(f.danger)} ・ 最後の理解 ${day(f.lastUnderstoodDate)}`;
  detail.append(h, summary);

  const changes = f.changesSinceUnderstood;
  const p = document.createElement("p");
  p.textContent = changes.length === 0
    ? "最後に理解してからの変更はありません"
    : `${f.lastUnderstoodDate ? "最後に理解してから" : "一度も理解していません。作られてから"}の変更 ${changes.length} 件:`;
  detail.append(p);
  if (changes.length > 0) {
    const table = document.createElement("table");
    for (const c of [...changes].reverse()) {
      const tr = table.insertRow();
      for (const text of [day(c.date), originLabel[c.origin], `+${c.added} −${c.deleted}`, c.commit.slice(0, 7)]) {
        tr.insertCell().textContent = text;
      }
    }
    const hint = document.createElement("p");
    hint.className = "meta";
    hint.innerHTML = "差分を見る: <code></code>";
    // git show は複数のコミットを受け付けるので、古い順に全部並べる
    hint.querySelector("code").textContent = `git show ${changes.map((c) => c.commit.slice(0, 7)).join(" ")} -- ${f.path}`;
    detail.append(table, hint);
  }
  draw();
}

const topDanger = report.files.filter((f) => f.danger > 0).sort((a, b) => b.danger - a.danger).slice(0, 10);
const list = document.getElementById("danger");
if (topDanger.length === 0) list.outerHTML = '<p class="meta">直近90日に変更されたファイルがないか、すべて理解済みです</p>';
for (const f of topDanger) {
  const li = document.createElement("li");
  li.innerHTML = '<span class="num"></span> ';
  li.querySelector(".num").textContent = fmt(f.danger);
  li.append(f.path);
  li.onclick = () => select(f.path);
  list.append(li);
}

draw();
addEventListener("resize", draw);
addEventListener("scroll", () => (tip.style.display = "none"), { passive: true });
</script>
</body>
</html>
